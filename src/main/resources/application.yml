spring:
  application:
    name: kotlin-outbox-pattern
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    ing.recruitment: DEBUG

outbox:
  publisher:
    enabled: true
    fixed-delay-ms: 5000
    batch-size: 10
    logging:
      payload-mode: METADATA_ONLY
